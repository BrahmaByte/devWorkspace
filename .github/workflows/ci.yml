name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            platform: win32
            arch: x64
          - name: macOS Intel
            os: macos-15-intel
            platform: darwin
            arch: x64
          - name: macOS Apple Silicon
            os: macos-15
            platform: darwin
            arch: arm64
          - name: Linux x64
            os: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify runner target
        run: node scripts/verify-release-target.mjs ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Validate and package extension
        run: npm run validate

      - name: Upload platform-validated VSIX
        uses: actions/upload-artifact@v4
        with:
          name: devdashboardv1-${{ matrix.platform }}-${{ matrix.arch }}
          path: devdashboardv1.vsix
          if-no-files-found: error
